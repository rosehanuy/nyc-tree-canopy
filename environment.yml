name: urban-tree-canopy
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy=2.2

  # geospatial
  - gdal
  - rasterio
  - rioxarray
  - geopandas
  - shapely
  - opencv
  - esda
  - libpysal
  - proj-data

  # Sentinel-2 access (Microsoft Planetary Computer)
  - pystac-client
  - planetary-computer
  - stackstac
  - requests
  - urllib3

  # arrays, storage, parallel processing
  - xarray
  - zarr>=2.18,<3
  - dask
  - distributed
  - bokeh            # needed for Dask dashboard 
  - pandas
  - pyarrow          # for reading/writing .parquet files
  - tqdm

  # modelling
  - scikit-learn=1.8.0
  - joblib
  - shap

  # plotting and notebooks
  - matplotlib
  - seaborn
  - jupyterlab
  - ipykernel

  - pip
  - pip:
      - -e .          # installs the utc_src package from this repo
